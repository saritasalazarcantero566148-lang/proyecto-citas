<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
</head>
<body>

    <h2>Restablecer contraseña</h2>

    {% if error %}
        <p style="color:red">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label>Nueva contraseña</label>
            <input
                type="password"
                name="password"
                required
            >
        </div>

        <br>

        <div>
            <label>Confirmar contraseña</label>
            <input
                type="password"
                name="password2"
                required
            >
        </div>

        <br>

        <button type="submit">
            Guardar contraseña
        </button>

    </form>

</body>
</html>
